<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/report.css">
<link rel="stylesheet" href="/activity.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="tl">
      <h1 id="title"></h1>
      <span class="meta" id="generated"></span>
      <div class="usage" id="usage"></div>
    </div>
    <div class="tr">
      <span class="status" id="status"></span>
      <span class="alt" id="actions"></span>
      <button class="btn" id="action" hidden></button>
    </div>
  </div>
</header>
<div class="lost" id="lost" hidden>__LOST__</div>
<main class="wrap">
  <section class="compose" id="composer" hidden>
    <div class="row"><textarea id="text" rows="3"></textarea><button class="btn big" id="add"></button></div>
    <p class="hint" id="composer-hint"></p>
    <p class="cstatus" id="composer-status"></p>
  </section>
  <p class="summary" id="summary" hidden></p>
  <div class="grid">
    <aside class="side" id="side" hidden>
      <div class="side-title" id="nav-title"></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-title" id="filter-title"></div>
      <div class="filters" id="filters"></div>
      <a class="anchor" id="trace-link" href="#details"></a>
    </aside>
    <div class="content">
      <div class="cards" id="cards"></div>
      <article id="body"></article>
      <section class="details" id="details"></section>
    </div>
  </div>
</main>
<script type="module" src="/report.js"></script>
</body>
</html>
